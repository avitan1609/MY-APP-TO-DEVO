/* SA · משמעת — charcoal / white with a petrol-green accent. Light is the base, .dark overrides. */
:root {
  --bg: #F5F6F7; --surface: #FFFFFF; --raised: #EFF1F3; --line: #E0E3E7;
  --ink: #111418; --muted: #58606C; --faint: #8A919C;
  --accent: #0D7A6C; --accent-ink: #FFFFFF; --accent-soft: #DCF1ED;
  --danger: #C82D34; --warn: #A86700; --overlay: rgba(10, 12, 15, .55);
  --font: 'Heebo', 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  --r: 18px;
  color-scheme: light;
}
.dark {
  --bg: #0C0E11; --surface: #15181D; --raised: #1E2229; --line: #2C313A;
  --ink: #ECEEF1; --muted: #A0A7B2; --faint: #747B86;
  --accent: #34C4AC; --accent-ink: #061E1A; --accent-soft: #12342F;
  --danger: #F56268; --warn: #F0B140; --overlay: rgba(0, 0, 0, .62);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
img { max-width: 100%; }
svg { flex-shrink: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; top: -40px; inset-inline-start: 8px; background: var(--accent); color: var(--accent-ink); padding: 6px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 8px; }

/* Utilities */
.c-accent { color: var(--accent); } .c-danger { color: var(--danger); } .c-warn { color: var(--warn); }
.c-muted, .mu { color: var(--muted); } .c-faint { color: var(--faint); } .c-ink { color: var(--ink); }
.strong { font-weight: 600; } .small { font-size: 13px; } .d { display: block; }
.inl { display: inline-flex; align-items: center; gap: 4px; }
.gap { gap: 8px; } .wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mt { margin-top: 12px; } .mt-s { margin-top: 8px; display: inline-block; } .mb { margin-bottom: 14px; }
.ms-auto { margin-inline-start: auto; }
.self-start { align-self: flex-start; }
.end-align { align-items: flex-end; }
.end { text-align: end; }
.w3 { width: 44px; flex-shrink: 0; } .w5 { width: 80px; flex-shrink: 0; } .w6 { width: 90px; flex-shrink: 0; }
.pre { white-space: pre-wrap; }
.scroll-x { overflow-x: auto; }
.link { color: var(--accent); font-size: 13px; text-underline-offset: 3px; }
.link:hover { text-decoration: underline; }
.muted-text { color: var(--muted); font-size: 14px; line-height: 1.6; }
.pill { background: var(--raised); border-radius: 12px; padding: 8px 12px; }

/* Logo per theme */
.logo { display: inline-block; flex-shrink: 0; }
.logo img { display: block; width: 100%; height: 100%; }
.logo-dark { display: none !important; }
.dark .logo-dark { display: block !important; }
.dark .logo-light { display: none !important; }

/* Splash */
#splash { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: flex; align-items: center; justify-content: center; transition: opacity .35s ease; }
#splash img { width: 120px; height: 120px; animation: logo-in .7s ease-out both; }
body.ready #splash { opacity: 0; pointer-events: none; }
@keyframes logo-in { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }

/* Shell */
.app { display: flex; min-height: 100vh; min-height: 100dvh; }
.side { display: none; }
.main { flex: 1; min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 20; height: calc(56px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); display: flex; align-items: center; justify-content: space-between; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; }
.icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--muted); flex-shrink: 0; }
.icon-btn:hover { background: var(--raised); color: var(--ink); }
.icon-btn[aria-current="page"] { color: var(--accent); }
.icon-btn.disabled { opacity: .3; pointer-events: none; }
.content { max-width: 760px; margin: 0 auto; padding-top: 20px; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.bottomnav { position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 95%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottomnav .row { max-width: 520px; margin: 0 auto; display: flex; }
.bottomnav a { flex: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); }
.bottomnav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
body[data-route="summary"] .fab, body[data-route="settings"] .fab { display: none; }
.fab { position: fixed; z-index: 21; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); width: 56px; height: 56px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .45); }

@media (min-width: 1024px) {
  .side { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; width: 240px; flex-shrink: 0; padding: 20px 12px; background: var(--surface); border-inline-end: 1px solid var(--line); }
  .side .brand { padding: 0 8px; margin-bottom: 22px; }
  .side .brand small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .side .new { height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .side .new:hover { filter: brightness(1.08); }
  .side nav { display: flex; flex-direction: column; gap: 2px; }
  .side nav a { height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: var(--muted); font-size: 14px; }
  .side nav a:hover { background: var(--raised); color: var(--ink); }
  .side nav a[aria-current="page"] { background: var(--raised); color: var(--ink); font-weight: 600; }
  .side-foot { margin-top: auto; padding: 8px; font-size: 12px; color: var(--faint); }
  .topbar, .bottomnav, .fab { display: none; }
  .content { padding-top: 32px; padding-bottom: 56px; }
}

/* Generic blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 16px; }
.inner { background: var(--bg); }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-h h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.page-h p { margin-top: 2px; font-size: 13px; color: var(--muted); }
.sec-t { margin: 26px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.h3 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.btn { height: 40px; padding: 0 16px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; background: var(--raised); border: 1px solid var(--line); white-space: nowrap; transition: filter .15s, border-color .15s, background .15s; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--raised); }
.btn.danger { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.lg { height: 50px; font-size: 15px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: flex; padding: 4px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); }
.seg button { flex: 1; height: 34px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; padding: 0 10px; text-align: center; }
.seg.sm button { height: 30px; font-size: 12.5px; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.scroll-x .seg { min-width: 460px; }
.field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 16px; min-height: 44px; }
